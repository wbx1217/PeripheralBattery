[package]
name = "peripheral-battery-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
build = "build.rs"

[[bin]]
name = "外设电量显示"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
gpui-kit = { version = "0.9.1", default-features = false }
peripheral-battery = { path = ".." }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# 不启用 pedantic：这个 crate 大量直接调用 Win32，`implicit borrow as raw pointer`
# 之类的提示会把真正的问题埋掉。默认组 + 项目自己的约定更实用。
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
